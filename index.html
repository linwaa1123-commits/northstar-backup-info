<main><h1>Northstar Quant Backup</h1>
<p>這是個人自用的加密備份工具，用來把紙上交易研究系統的資料庫副本保存到使用者自己的 Google Drive。它不向交易所下單，也不提供投資服務。</p>
<p>每份備份先在隔離資料庫中實際還原、核對內容，再加密上傳；上傳後重新下載並驗證完整性。原本的研究紀錄不會被覆寫。</p>
<p>Google 授權僅使用 <code>drive.file</code> 範圍，讓程式管理它自己建立的備份檔案。使用者可隨時在 Google 帳戶撤銷授權。</p>
<p><a href="privacy.html">隱私權與資料使用說明</a></p>
